
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="350" viewBox="0 0 300 350" style="background: white;">
  <!-- Staff lines -->
  <line x1="60" y1="50" x2="280" y2="50" stroke="#000000" stroke-width="0.65"/>
  <line x1="60" y1="100" x2="280" y2="100" stroke="#000000" stroke-width="0.65"/>
  <line x1="60" y1="150" x2="280" y2="150" stroke="#000000" stroke-width="1.35"/>
  <line x1="60" y1="200" x2="280" y2="200" stroke="#000000" stroke-width="0.65"/>
  <line x1="60" y1="250" x2="280" y2="250" stroke="#000000" stroke-width="0.65"/>

  <!-- Brace clasping from y=50 to y=250 -->
  <path d="M 60.00 50.00 C 57.00 52.00, 49.50 75.00, 49.50 100.00 C 49.50 125.00, 48.00 148.50, 46.00 150.00 C 48.00 151.50, 49.50 175.00, 49.50 200.00 C 49.50 225.00, 57.00 248.00, 60.00 250.00 C 57.50 248.00, 51.30 225.00, 51.30 200.00 C 51.30 175.00, 49.30 151.20, 46.50 150.00 C 49.30 148.80, 51.30 125.00, 51.30 100.00 C 51.30 75.00, 57.50 52.00, 60.00 50.00 Z" fill="#111827"/>

  <!-- o3 pill badge at cusp -->
  <rect x="26" y="145" width="16" height="10" rx="2.5" fill="#111827"/>
  <text x="34" y="152.5" font-family="serif" font-style="italic" font-weight="bold" font-size="7" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">o3</text>

  <!-- o5 and o1 labels -->
  <text x="34" y="52" font-family="serif" font-style="italic" font-weight="bold" font-size="7" fill="#666666" text-anchor="middle">o5</text>
  <text x="34" y="254" font-family="serif" font-style="italic" font-weight="bold" font-size="7" fill="#666666" text-anchor="middle">o1</text>

  <!-- Measure number -->
  <text x="24" y="36" font-family="serif" font-style="italic" font-size="9" fill="#444444">1</text>

  <!-- Time signature 3/4 -->
  <text x="48" y="138" font-family="serif" font-weight="bold" font-size="10" fill="#111111">3</text>
  <text x="48" y="166" font-family="serif" font-weight="bold" font-size="10" fill="#111111">4</text>
</svg>
