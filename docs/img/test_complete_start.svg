<svg xmlns="http://www.w3.org/2000/svg" width="300" height="320" viewBox="0 0 300 320" style="background: white;">
  <style>
    .meta { font-family: "Century Schoolbook", Georgia, serif; font-style: italic; }
    .measure-num { font-family: "Century Schoolbook", Georgia, serif; font-style: italic; font-size: 9pt; fill: #333333; }
    .duo-digit { font-family: "Century Gothic", "ITC Avant Garde Gothic", "Avant Garde", sans-serif; text-anchor: middle; dominant-baseline: central; font-weight: bold; }
  </style>

  <!-- Measure Number in Dedicated Left Margin -->
  <text x="28" y="38" class="measure-num">1</text>

  <!-- Middle C Badge and Connector Tick -->
  <rect x="46" y="146.5" width="20" height="11" rx="2.5" fill="#111827"/>
  <text x="56" y="154.4" class="meta" font-weight="bold" font-size="7pt" fill="#FFFFFF" text-anchor="middle">o3</text>
  <line x1="66" y1="152" x2="68" y2="152" stroke="#111827" stroke-width="1.25"/>

  <!-- o5 and o1 octave boundary indicators -->
  <text x="56" y="53.2" class="meta" font-weight="bold" font-size="7pt" fill="#555555" text-anchor="middle">o5</text>
  <line x1="66" y1="50" x2="82" y2="50" stroke="#888888" stroke-width="0.6"/>

  <text x="56" y="257.2" class="meta" font-weight="bold" font-size="7pt" fill="#555555" text-anchor="middle">o1</text>
  <line x1="66" y1="254" x2="82" y2="254" stroke="#888888" stroke-width="0.6"/>

  <!-- Accolade Curly Brace clasping o5 to o1 -->
  <path d="M 82.00 50.00 C 78.40 58.16, 74.00 75.50, 74.00 96.92 C 74.96 131.60, 69.80 148.80, 68.00 152.00 C 69.80 155.20, 74.96 172.40, 74.00 207.08 C 74.00 228.50, 78.40 245.84, 82.00 254.00 C 78.84 245.84, 75.45 228.50, 75.45 207.08 C 76.05 172.40, 70.16 154.80, 68.65 152.00 C 70.16 149.20, 76.05 131.60, 75.45 96.92 C 75.45 75.50, 78.84 58.16, 82.00 50.00 Z" fill="#111827"/>

  <!-- Staff Lines emerging cleanly from staffLeft without closing vertical barline -->
  <line x1="82" y1="50" x2="280" y2="50" stroke="#000000" stroke-width="0.65"/>
  <line x1="82" y1="67" x2="280" y2="67" stroke="#444444" stroke-width="0.6" stroke-dasharray="5,2.5"/>
  <line x1="82" y1="101" x2="280" y2="101" stroke="#000000" stroke-width="0.65"/>
  <line x1="82" y1="118" x2="280" y2="118" stroke="#444444" stroke-width="0.6" stroke-dasharray="5,2.5"/>
  <line x1="82" y1="152" x2="280" y2="152" stroke="#000000" stroke-width="1.35"/>
  <line x1="82" y1="169" x2="280" y2="169" stroke="#444444" stroke-width="0.6" stroke-dasharray="5,2.5"/>
  <line x1="82" y1="203" x2="280" y2="203" stroke="#000000" stroke-width="0.65"/>
  <line x1="82" y1="220" x2="280" y2="220" stroke="#444444" stroke-width="0.6" stroke-dasharray="5,2.5"/>
  <line x1="82" y1="254" x2="280" y2="254" stroke="#000000" stroke-width="0.65"/>

  <!-- Opening Sound at tick 0 with Concentric Halo Ring -->
  <!-- Note on o2 (pitch 31 = G2, 7 semitones above o1) -->
  <!-- ny = yBot - 7 * 4.25 = 254 - 29.75 = 224.25 -->
  <!-- nx = staffLeft + 6 = 88 -->
  <circle cx="88" cy="224.25" r="4.75" fill="none" stroke="#1D4ED8" stroke-width="0.75"/>
  <circle cx="88" cy="224.25" r="3.65" fill="#FFFFFF"/>
  <text x="88" y="224.55" class="duo-digit" font-size="5.4pt" fill="#1D4ED8">7</text>

  <!-- Note on o4 (pitch 55 = G4, 7 semitones above o3) -->
  <!-- ny = ym - 7 * 4.25 = 152 - 29.75 = 122.25 -->
  <circle cx="88" cy="122.25" r="4.75" fill="none" stroke="#1E293B" stroke-width="0.75"/>
  <circle cx="88" cy="122.25" r="3.65" fill="#FFFFFF"/>
  <text x="88" y="122.55" class="duo-digit" font-size="5.4pt" fill="#1E293B">7</text>

  <!-- Note class 11 (B) under Middle C (pitch 47, ny = ym + 4.25 = 156.25) at nx = 120 -->
  <circle cx="120" cy="156.25" r="3.65" fill="#FFFFFF"/>
  <text x="120" y="156.55" class="duo-digit" font-size="5.4pt" fill="#1E293B">B</text>

  <!-- Note class 11 (B) under o5 (pitch 71, ny = yTop + 4.25 = 54.25) at nx = 140 -->
  <circle cx="140" cy="54.25" r="3.65" fill="#FFFFFF"/>
  <text x="140" y="54.55" class="duo-digit" font-size="5.4pt" fill="#1E293B">B</text>
</svg>