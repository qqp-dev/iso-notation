  <line x1="130" y1="219.0" x2="135.5" y2="219.0" stroke="#1E293B" stroke-width="1.0" stroke-linecap="round"/>
  <rect x="125.8" y="214.8" width="8.4" height="8.4" rx="1.5" fill="#FFFFFF"/>
  <rect x="126.8" y="215.8" width="6.4" height="6.4" rx="1.0" fill="#1E293B"/>

  <!-- Note 9: G2 (PC 7 -> Row 1 -> Ellipse) -->
