  <line x1="155" y1="132.6" x2="160.5" y2="132.6" stroke="#1D4ED8" stroke-width="1.0" stroke-linecap="round"/>
  <ellipse cx="155" cy="132.6" rx="6.0" ry="3.9" fill="#FFFFFF"/>
