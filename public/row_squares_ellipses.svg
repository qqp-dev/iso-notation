  <ellipse cx="95" cy="247.8" rx="5.0" ry="2.9" fill="#1D4ED8"/>

  <!-- Note 10: E3 (PC 4 -> Row 0 -> Square) -->
  <line x1="140" y1="247.8" x2="145.5" y2="247.8" stroke="#1E293B" stroke-width="1.0" stroke-linecap="round"/>
  <rect x="135.8" y="243.6" width="8.4" height="8.4" rx="1.5" fill="#FFFFFF"/>
  <rect x="136.8" y="244.6" width="6.4" height="6.4" rx="1.0" fill="#1E293B"/>

  <!-- Note 11: F#3 (PC 6 -> Row 0 -> Square) -->
  <line x1="150" y1="276.6" x2="155.5" y2="276.6" stroke="#1E293B" stroke-width="1.0" stroke-linecap="round"/>
  <rect x="145.8" y="272.4" width="8.4" height="8.4" rx="1.5" fill="#FFFFFF"/>
