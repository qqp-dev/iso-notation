<svg xmlns="http://www.w3.org/2000/svg" width="300" height="370.4" viewBox="0 0 300 370.4">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="150" y="28" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-weight="bold" font-size="13" fill="#111">ROW-PARITY: Square (Row 0) &amp; Ellipse (Row 1)</text>
  <text x="150" y="46" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="#555">Symmetric 1-5-9 Lines: 1=Bold Octave, 5=Small Dashes, 9=Thin Straight</text>
  
  <!-- Octave m2 -->
  <line x1="60" y1="75" x2="60" y2="305.4" stroke="#111111" stroke-width="1.2"/>
  <text x="60" y="67" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="10" font-weight="bold" fill="#111">m2</text>
  
  <!-- Line 5 (PC 4): Small Dashes -->
  <line x1="80" y1="75" x2="80" y2="305.4" stroke="#555555" stroke-width="0.6" stroke-dasharray="5,2.5"/>
  <text x="80" y="67" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="8" fill="#555">5</text>
  
  <!-- Line 9 (PC 8): Thin Straight Solid -->
  <line x1="100" y1="75" x2="100" y2="305.4" stroke="#555555" stroke-width="0.6"/>
  <text x="100" y="67" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="8" fill="#555">9</text>
  
  <!-- Octave m3 -->
