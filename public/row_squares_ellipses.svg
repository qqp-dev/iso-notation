  <text x="40" y="79" text-anchor="end" font-family="'DejaVu Sans Mono', monospace" font-size="10" font-weight="bold">1</text>
  <line x1="45" y1="190.2" x2="255" y2="190.2" stroke="#222" stroke-width="0.8"/>
  <text x="40" y="194.2" text-anchor="end" font-family="'DejaVu Sans Mono', monospace" font-size="10" font-weight="bold">2</text>
  <line x1="45" y1="305.4" x2="255" y2="305.4" stroke="#222" stroke-width="0.8"/>
  <text x="40" y="309.4" text-anchor="end" font-family="'DejaVu Sans Mono', monospace" font-size="10" font-weight="bold">3</text>
  
  <!-- Notes: Bach Goldberg Excerpt -->
