  <text x="220" y="67" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="8" fill="#555">9</text>
  
  <!-- Octave m5 -->
  <line x1="240" y1="75" x2="240" y2="305.4" stroke="#111111" stroke-width="1.2"/>
  <text x="240" y="67" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="10" font-weight="bold" fill="#111">m5</text>
  
  <!-- Barlines -->
