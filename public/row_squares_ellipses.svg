  <text x="140" y="67" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="8" fill="#555">5</text>
  
  <!-- Line 9 (PC 8): Thin Straight Solid -->
  <line x1="160" y1="75" x2="160" y2="305.4" stroke="#555555" stroke-width="0.6"/>
  <text x="160" y="67" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="8" fill="#555">9</text>
  
  <!-- Octave m4 -->
  <line x1="180" y1="75" x2="180" y2="305.4" stroke="#111111" stroke-width="1.2"/>
  <text x="180" y="67" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="10" font-weight="bold" fill="#111">m4</text>
  
  <!-- Line 5 (PC 4): Small Dashes -->
