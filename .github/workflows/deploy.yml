name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The independent data classifier checks HEAD^ and authenticates
          # undo against earlier score revisions in first-parent history.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Ubuntu's packaged real LilyPond (2.24+) compiles the Brahms
          # expression fixture and export listener during the mandatory tests.
          sudo apt-get install -y librsvg2-bin poppler-utils fonts-urw-base35 fonts-liberation lilypond
          lilypond --version

      - name: Install dependencies
        run: npm ci

      - name: Verify data-only release provenance and matching PDF
        # Non-data commits retain the reviewed software lane; this gate only
        # adds checks, and cannot replace the mandatory regression/build below.
        run: node --import tsx scripts/verify-data-release.ts

      - name: Run tests
        run: npm test

      - name: Strict canonical engraving lint
        run: npm run lint:engraving -- --strict

      - name: Build production bundle
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
