<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jánko Engraving Studio — Candidates &amp; Golden Reference</title>
  <style>
    /* The duodecimal digits are engraved in URW Gothic; load it for the live SVG. */
    @font-face {
      font-family: "URW Gothic";
      font-weight: 400;
      font-display: swap;
      src: url("/fonts/URWGothic-Book.otf") format("opentype");
    }
    @font-face {
      font-family: "URW Gothic";
      font-weight: 700 900;
      font-display: swap;
      src: url("/fonts/URWGothic-Demi.otf") format("opentype");
    }

    :root {
      --bg: #000;
      --surface: #000;
      --surface-2: #000;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --ok: #34d399;
      --warn: #fbbf24;
      --error: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    /* Reserve the same viewport width when Source uses internal pane scrolling
       and when the prepared Reference/Candidates page uses document scrolling. */
    html { scrollbar-gutter: stable; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ---------------------------------------------------------------- chrome */
    body > header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: #000;
      border-bottom: 1px solid var(--border);
      padding: 10px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand h1 { font-size: 17px; letter-spacing: -0.02em; }
    .brand p { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .brand code { color: var(--accent); font-size: 11px; }
    .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .tabs { display: flex; gap: 4px; }
    .tab {
      background: #263449;
      color: #cbd5e1;
      border: 1px solid #3b4d68;
      border-radius: 7px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
      min-height: 36px;
    }
    .tab:hover { background: #33465f; color: #fff; }
    .tab.is-active { background: var(--accent); border-color: var(--accent); color: #08131f; }
    .zoom-group {
      display: flex;
      align-items: center;
      gap: 2px;
      background: #0a1120;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 2px;
    }
    .zoom-group button {
      background: transparent;
      border: 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      border-radius: 5px;
      padding: 6px 10px;
      min-height: 32px;
      min-width: 32px;
      cursor: pointer;
    }
    .zoom-group button:hover { color: #fff; background: #1e293b; }
    #janko-zoom-label { font-size: 11px; font-weight: 700; min-width: 46px; text-align: center; }

    /* ----------------------------------------------------------------- views */
    main { flex: 1; padding: 18px; display: flex; flex-direction: column; gap: 18px; }
    [hidden] { display: none !important; }
    .view-panel { display: none; }
    .view-panel.is-active { display: block; }

    .round-card, .golden-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
      margin-bottom: 18px;
    }
    .round-card h2, .golden-card h2 { font-size: 19px; margin: 8px 0 6px; }
    .round-card p, .golden-card p { font-size: 13px; line-height: 1.55; color: #cbd5e1; max-width: 110ch; }
    .round-badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.16);
      color: var(--accent);
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .round-meta { margin-top: 8px; font-size: 12px !important; color: var(--muted) !important; }
    .round-meta code { color: var(--accent); }
    .section-title { font-size: 14px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 22px 0 10px; }

    .candidate-grid, .page-grid, .crop-grid { display: grid; gap: 16px; }
    .candidate-grid { grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); }
    .page-grid { grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); }
    .crop-grid { grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); }

    .candidate-card, .page-card, .crop-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .candidate-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .candidate-head h3 { font-size: 14.5px; }
    .rationale { font-size: 12px; color: var(--muted); line-height: 1.5; }
    .chips { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .chip { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
    .chip-ok { background: rgba(52, 211, 153, 0.16); color: var(--ok); }
    .chip-warn { background: rgba(251, 191, 36, 0.16); color: var(--warn); }
    .chip-error { background: rgba(248, 113, 113, 0.18); color: var(--error); }
    .tag {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #0b1120;
      background: #7dd3fc;
      border-radius: 4px;
      padding: 3px 7px;
    }
    /* Round 31: GOLD = frozen perfection standard, BRONZE = active surface. */
    .tag-gold { background: #fbbf24; }
    .tag-bronze { background: #d08a4e; }
    .known-finding, .known-note { color: var(--warn); }
    .known-finding { font-size: 11px; }
    .known-note { font-style: normal; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; }
    .badge {
      font-size: 11px;
      background: #0f1c30;
      border: 1px solid #2f4258;
      color: #cbd5e1;
      border-radius: 6px;
      padding: 3px 8px;
    }
    .badge b { color: #e2e8f0; font-weight: 700; }
    .badge-delta { border-color: var(--accent); color: #e0f2fe; }
    .badge-axis { border-color: #a78bfa; box-shadow: inset 0 0 0 1px rgba(167, 139, 250, 0.35); }
    .badge-axis::after { content: ' · round axis'; color: #c4b5fd; font-size: 10px; }
    .badge s { color: var(--muted); margin-left: 4px; }

    .canvas-frame {
      background: #fff;
      border-radius: 8px;
      overflow: auto;
      max-height: 74vh;
      padding: 6px;
    }
    .janko-canvas {
      /* 100% = fit the card width; zoom multiplies from there (0.5×–3×). */
      width: calc(100% * var(--janko-zoom, 1));
      transition: width 0.12s ease;
    }
    .janko-canvas .janko-svg { display: block; width: 100%; height: auto; }
    /* Round 5: a candidate is judged on several engraving windows at once. */
    .candidate-windows { display: flex; flex-direction: column; gap: 10px; }
    /* Round 26: the closer-comparison strip — one macro window per card in a row. */
    .compare-strip { display: grid; gap: 12px; margin: 6px 0 22px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
    .compare-strip .strip-head { grid-column: 1 / -1; }
    .strip-panel { display: flex; flex-direction: column; gap: 5px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
    .strip-panel figcaption { font-size: 11.5px; color: #e2e8f0; }
    .strip-panel figcaption b { font-size: 12px; font-weight: 600; }
    @media (max-width: 700px) {
      .compare-strip { grid-auto-flow: column; grid-auto-columns: 86%; grid-template-columns: none; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 8px; }
      .strip-panel { scroll-snap-align: start; }
    }
    .candidate-window { display: flex; flex-direction: column; gap: 5px; }
    .candidate-window figcaption { font-size: 11.5px; color: #e2e8f0; line-height: 1.4; }
    .candidate-window figcaption b { font-size: 12px; font-weight: 600; }
    .candidate-foot { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .page-card figcaption, .crop-card figcaption {
      font-size: 12px;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .page-card figcaption b, .crop-card figcaption b { font-size: 12.5px; }
    .crop-card figcaption span { color: var(--muted); font-size: 11.5px; line-height: 1.45; }

    .diagnostics {
      margin-top: 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 12.5px;
    }
    .diagnostics summary { cursor: pointer; font-weight: 700; }
    .diagnostics ul { list-style: none; margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
    .diagnostics li { line-height: 1.45; color: #cbd5e1; }
    .diag-error { color: #fecaca !important; }
    .diag-warning { color: #fde68a !important; }
    .diag-ok { color: var(--ok) !important; }
    .diagnostics code { color: var(--accent); }

    .reference-picker { display: none; align-items: center; gap: 6px; font-size: 12px; }
    body:has(#janko-tab-reference.is-active) .reference-picker { display: flex; }
    body:has(#janko-tab-reference.is-active) .source-mode-switch { display: none; }
    .source-mode .zoom-group { display: none; }
    .reference-picker select { background: #000; color: #fff; border: 1px solid #777; padding: 4px; max-width: min(54vw, 230px); }
    .reference-score[data-score="brahms-op118-no1"]:not([data-reader-selected="true"]) { display: none; }
    .reference-score[hidden] { display: none !important; }
    .source-review { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
    .source-review h2 { font-size: 19px; margin: 10px 0; }
    .source-review > p { color: #cbd5e1; line-height: 1.5; font-size: 13px; margin: 8px 0; }
    .source-mode-switch, .source-mobile-switch { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .source-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 14px; }
    .source-pane { min-width: 0; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
    .source-pane h3 { font-size: 15px; margin-bottom: 10px; }
    .source-pane select { max-width: 100%; margin: 0 0 10px 8px; }
    .source-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 10px 0; }
    .source-controls button, .source-mobile-switch button { background: #263449; color: white; border: 1px solid #4a607b; border-radius: 5px; min-height: 36px; padding: 5px 10px; cursor: pointer; }
    .source-controls button:focus-visible, .source-mode-switch button:focus-visible { outline: 2px solid var(--accent); }
    .source-page { font-weight: 700; font-size: 12px; margin-right: 10px; }
    .source-status { font-size: 12px; color: var(--muted); }
    .source-status:empty { display: none; }
    .source-canvas { background: white; max-height: 72vh; min-height: 100px; overflow: auto; }
    .source-canvas canvas, .source-canvas img { display: block; max-width: none; }
    .source-work { max-width: min(85vw, 350px); }
    .source-edition { font-size: 12px; line-height: 1.35; margin: 3px 0; }
    .source-link, .source-catalogue { display: inline-block; font-size: 12px; margin-right: 10px; }
    .source-catalogue[hidden] { display: none; }
    .source-mobile-switch { display: none; }
    @media (max-width: 700px) {
      .source-grid { display: block; }
      .source-mode .source-mobile-switch { display: flex; }
      .source-review[data-mobile-pane="reference"] .source-candidate,
      .source-review[data-mobile-pane="candidate"] .source-reference { display: none; }
    }
    /* Paper-first chrome: the only white surfaces are the authentic pages.
       A single vertical scroller per Source pane; Reference keeps native flow. */
    html, body, header, main, footer, #janko-studio, .view-panel,
    .source-grid, .source-controls, .source-mobile-switch,
    .source-mode-switch, .zoom-group, .tab, .tab:hover,
    .tab.is-active, .zoom-group button, .zoom-group button:hover,
    .round-card, .golden-card, .candidate-card, .page-card, .crop-card,
    .strip-panel, .diagnostics, .source-review, .source-pane,
    .source-canvas, .source-controls button, .source-mobile-switch button,
    .source-mode-switch button, .badge, .chip, .tag, details, summary {
      background: #000; background-image: none; backdrop-filter: none;
    }
    body > header, body > footer, .round-card, .golden-card, .candidate-card,
    .page-card, .crop-card, .strip-panel, .diagnostics, .source-review,
    .source-pane, .zoom-group, .tab, .source-controls button,
    .source-mobile-switch button, .badge { border: 0; border-radius: 0; box-shadow: none; }
    body > header { position: relative; padding: 2px 10px; display: flex; flex-direction: column; align-items: stretch; gap: 2px; }
    .navigation-row { height: 44px; display: flex; align-items: center; }
    .brand h1 { font-size: 14px; }
    .brand p { display: none; }
    .tabs { gap: 8px; margin-left: auto; }
    .context-toolbar { min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 4px; min-width: 0; }
    .tab, .source-controls button, .source-mobile-switch button, .zoom-group button,
    select, summary { min-height: 44px; cursor: pointer; color: var(--text); }
    .tab { padding: 4px 5px; font-size: 12px; }
    .tab, .tab:hover, [aria-pressed] { color: var(--muted); text-decoration: none; }
    .tab.is-active, .tab[aria-current="page"], [aria-pressed="true"] { color: #fff; font-weight: 700; text-decoration: none; }
    :focus-visible { outline: 2px solid #38bdf8 !important; outline-offset: 2px; }
    main { padding: 4px 8px; gap: 2px; min-width: 0; }
    .source-mode-switch { gap: 8px; flex-wrap: nowrap; }
    .source-mode-switch > span { display: none; }
    .reference-picker select { min-width: 0; max-width: none; }
    .work-picker { display: none; align-items: center; gap: 8px; min-width: 0; flex: 1; font-size: 12px; }
    .source-mode .work-picker { display: flex; }
    .source-mode .context-toolbar { flex-wrap: wrap; }
    .source-mode .work-picker { flex-basis: 100%; }
    .work-picker select { min-width: 0; width: 100%; flex: 1; font-size: 13px; }
    .reference-picker { flex: 1; min-width: 0; }
    .reference-picker select { color-scheme: dark; }
    .reference-picker select { flex: 1; width: 100%; }
    .source-mode .source-mobile-switch { display: flex; }
    .zoom-group { flex: none; padding: 0; gap: 0; }
    .zoom-group button { min-width: 44px; min-height: 44px; padding: 2px; }
    #janko-zoom-label { min-width: 30px; }
    .source-review { padding: 0; }
    .studio-extra summary, .diagnostics summary { display: list-item; padding: 10px 0; color: #cbd5e1; }
    .source-grid { margin: 0; gap: 12px; }
    .source-pane { padding: 0; }
    .source-pane h3 { margin: 0; font-size: 13px; }
    .source-pane label { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    select, select:hover, select:focus { color-scheme: dark; background: #000; color: #fff; border: 1px solid #777; border-radius: 0; }
    .source-pane select { margin: 0; flex: 1; min-width: 0; }
    .source-controls { margin: 0; gap: 2px; flex-wrap: nowrap; justify-content: space-between; }
    .source-controls button { min-width: 44px; padding: 2px; }
    .source-controls .source-page { margin: 0; font-size: 11px; white-space: nowrap; }
    .source-zoom { font-size: 11px; }
    .source-status { min-height: 0; margin: 0; line-height: 1.4; overflow-wrap: anywhere; }
    .source-pane[data-render-state="error"] .source-status { order: -1; color: var(--error); }
    .source-canvas { min-height: 0; max-height: none; overflow: auto; scrollbar-gutter: stable; overscroll-behavior: contain; }
    .canvas-frame { padding: 0; border-radius: 0; background: #000; max-height: none; }
    .round-card, .golden-card, .candidate-card, .page-card, .crop-card,
    .diagnostics, .strip-panel { padding: 0; margin-bottom: 12px; gap: 4px; }
    .round-card h2, .golden-card h2 { margin: 2px 0; }
    .round-meta, .section-title { margin: 2px 0; }
    .page-card figcaption, .crop-card figcaption { order: 2; }
    .round-badge, .chip, .badge, .tag { background: #000; border: 0; padding: 0; border-radius: 0; color: var(--text); }
    .tag-gold { color: #fbbf24; } .tag-bronze { color: #d08a4e; }
    .page-grid, .crop-grid, .candidate-grid { gap: 12px; }
    .page-grid { grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); }
    .crop-grid { grid-template-columns: repeat(auto-fit, minmax(min(100%, 580px), 1fr)); }
    .compare-strip { gap: 10px; }
    .diagnostics { margin-top: 0; }
    .diagnostics ul { list-style: disc; padding-left: 20px; }
    body.source-mode { height: 100dvh; min-height: 0; overflow: hidden; }
    .source-mode main { flex: 1; min-height: 0; overflow: hidden; }
    .source-mode .source-review { display: flex; flex: 1; min-height: 0; flex-direction: column; }
    .source-mode .source-grid { flex: 1; min-height: 0; }
    .source-mode .source-pane { display: flex; min-height: 0; flex-direction: column; }
    .source-mode .source-canvas { flex: 1; }
    #janko-status:empty, #janko-status[data-healthy="true"] { display: none; }
    @media (max-width: 700px) {
      .brand { display: none; }
      .tabs { width: 100%; justify-content: space-between; }
      .source-mobile-switch { gap: 4px; flex-wrap: nowrap; }
      .source-mobile-switch button { min-width: 44px; padding: 2px 4px; font-size: 12px; }
      .source-mode-switch { gap: 4px; }
      .source-mode-switch .tab { padding-inline: 2px; }
      .reference-picker select { max-width: none; }
      .source-mobile-switch .short-label { display: none; }
      .source-mode .source-grid { display: flex; min-height: 0; }
      .source-mode .source-pane { flex: 1; min-width: 0; }
      .source-review[data-mobile-pane="reference"] .source-candidate,
      .source-review[data-mobile-pane="candidate"] .source-reference { display: none; }
      .source-pane h3 { display: none; }
      .context-toolbar > * { min-width: 0; }
      .page-grid, .crop-grid, .candidate-grid { display: block; }
      .page-card, .crop-card, .candidate-card { margin: 0 0 14px; }
      .compare-strip { grid-auto-columns: 96%; }
    }
    @media (max-width: 370px) {
      .source-mobile-switch .long-label { display: none; }
      .source-mobile-switch .short-label { display: inline; }
    }
    /* A short phone landscape viewport cannot give the PDF pane a usable
       vertical scroll area. Keep the studio mounted (and its canvases/anchors)
       while hiding it both visually and from keyboard/assistive navigation. */
    .portrait-notice { display: none; }
    @media (orientation: landscape) and (max-height: 500px) and (max-width: 1000px) and (pointer: coarse) {
      body > header, body > main, body > footer { visibility: hidden; }
      .portrait-notice {
        display: flex;
        position: fixed;
        inset: 0;
        z-index: 100;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #000;
        color: #fff;
        text-align: center;
        font-size: 18px;
      }
    }
    /* Diagnostics live with Engraving, not in a persistent reading footer. */
    .engraving-details { display: none; position: relative; color: var(--muted); font-size: 12px; flex: none; }
    body:not(.source-mode):has(#view-candidates.is-active) .engraving-details,
    body:not(.source-mode):has(#view-reference.is-active):has(#janko-status[data-problem="true"]) .engraving-details { display: block; }
    body.source-mode .context-toolbar .zoom-group { display: none; }
    .engraving-details summary { min-height: 44px; display: flex; align-items: center; }
    #janko-status-diagnostics { position: absolute; right: 0; top: 100%; z-index: 60; width: min(90vw, 420px); max-height: 35dvh; overflow: auto; overflow-wrap: anywhere; padding: 10px; background: #000; border: 1px solid #777; }
    #janko-status { display: none; font-size: 13px; color: var(--warn); overflow-wrap: anywhere; }
    body:not(.source-mode) #janko-status[data-problem="true"] { display: block; }
    .studio-recovery { font-size: 12px; color: var(--muted); }
    .studio-recovery summary { min-height: 44px; }
    .round-badge, .section-title { display: none; }
    .round-meta { font-size: 12px !important; }
    .studio-extra .round-badge { display: inline; }
    .golden-card .studio-extra .badges { display: flex; }
    .round-card, .golden-card { border: 0; padding-bottom: 0; margin-bottom: 4px; }
    .round-card h2, .golden-card h2 { font-size: 16px; margin: 0; }
    .studio-extra summary { min-height: 32px; padding: 4px 0; font-size: 12px; }
    .candidate-card .studio-extra .badges { display: flex; }
    .candidate-card .studio-extra .candidate-foot { display: block; }
    .source-link, .source-catalogue { color: #ddd; text-decoration: underline; text-underline-offset: 2px; }
    .source-identity { flex-wrap: nowrap; align-items: center; }
    .source-identity-label { font-weight: 500; }
    .source-identity .source-page { flex: 1; }
    .source-details { position: relative; color: var(--muted); font-size: 12px; flex: none; }
    .source-details summary { min-height: 44px; padding: 0 2px; cursor: pointer; color: var(--muted); }
    .source-details-content { position: absolute; right: 0; top: 100%; z-index: 20; width: min(90vw, 360px); max-height: 35dvh; overflow: auto; overflow-wrap: anywhere; background: #000; border: 1px solid #777; padding: 10px; }
    .source-details-content label { display: flex; }
    .source-details-content select { min-width: 0; }
    .source-details label { min-height: 44px; }
    .source-details p { overflow-wrap: anywhere; }
    .source-identity { display: flex; flex-wrap: wrap; gap: 2px 10px; justify-content: space-between; align-items: baseline; min-width: 0; padding: 3px 0; font-size: 12px; line-height: 1.3; }
    .source-identity-label { font-size: 13px; font-weight: 600; }
    .source-identity .source-page { margin: 0; font-size: 12px; }
    .source-canvas { min-width: 0; }
    .prepared-error { color: var(--error); font-size: 13px; overflow-wrap: anywhere; }
    .candidate-recovery { max-width: 100%; font-size: 12px; color: var(--muted); }
    .candidate-recovery[open] { max-height: 35dvh; overflow: auto; overflow-wrap: anywhere; }
    .candidate-recovery summary { min-height: 32px; cursor: pointer; }
    .studio-recovery .candidate-card { padding: 4px 0; margin: 0; color: var(--muted); }
    .studio-recovery .candidate-card h3 { font-size: 13px; line-height: 1.4; }
    .round-card, .golden-card { border-bottom: 1px solid #303030; padding-bottom: 8px; }
    .tab.is-active, [aria-pressed="true"] { text-decoration: none; }
    @media (max-width: 700px) {
      body > header { padding: 2px 8px; }
      .source-mode main { padding: 2px 8px; }
      .source-identity { display: flex; }
      .source-identity .source-page { display: inline; }
      .source-identity-label { display: none; }
      .source-identity .source-page { white-space: normal; }
      .source-mode .source-canvas { min-height: 0; }
    }

    @media (max-width: 700px) {
      main { padding: 10px; }
      .source-mode main { padding: 2px 8px; }
      .brand p { display: none; }
    }
  </style>
</head>
<body>
  <div class="portrait-notice" role="status">Rotate to portrait</div>
  <header>
    <div class="navigation-row">
      <div class="brand"><h1>Jánko Engraving Studio</h1></div>
      <nav class="tabs" aria-label="Studio views">
        <button class="tab" id="janko-tab-source" data-studio-mode="source" aria-current="false">Source</button>
        <button class="tab" id="janko-tab-candidates" data-view-target="candidates" data-studio-mode="engraving" aria-current="false">Engraving</button>
        <button class="tab" id="janko-tab-reference" data-view-target="reference" aria-current="false">Reference</button>
      </nav>
    </div>
    <div class="context-toolbar" aria-label="View controls">
      <label class="work-picker">Work <select class="source-work" aria-label="Source work"></select></label>
      <label class="reference-picker">Piece <select id="janko-reference-picker" aria-label="Reference piece"><option value="primary">Bach · GOLD</option><option value="brahms-op118-no1">Brahms · BRONZE</option></select></label>
      <div class="source-mobile-switch" aria-label="Mobile comparison pane"><button data-mobile-pane="reference" aria-label="Original"><span class="long-label">Original</span><span class="short-label">Original</span></button><button data-mobile-pane="candidate" aria-label="Transcription"><span class="long-label">Transcription</span><span class="short-label">Transcription</span></button></div>
      <details id="janko-status-details" class="engraving-details"><summary>Details</summary><div id="janko-status-diagnostics"></div></details>
      <div class="zoom-group" role="group" aria-label="Engraving zoom">
        <button id="janko-zoom-out" title="Zoom out (−)" aria-label="Zoom out">−</button>
        <span id="janko-zoom-label">100%</span>
        <button id="janko-zoom-in" title="Zoom in (+)" aria-label="Zoom in">+</button>
        <button id="janko-zoom-reset" title="Reset zoom (0)" style="font-size:10px">Reset</button>
      </div>
    </div>
  </header>

  <main>
    <div id="janko-status" role="status"></div>
    <div id="source-review" class="source-review" hidden>
      <div class="source-grid"></div>
    </div>
    <!-- Rendered live by src/render/janko/studio.ts (Vite HMR). -->
    <div id="janko-studio" data-initial-view="candidates">
      <p style="color:#94a3b8;font-size:13px">Loading the prepared engraving…</p>
    </div>
  </main>

  <script type="module" src="/src/render/janko/prepared/viewer.ts"></script>
  <script type="module" src="/src/source-review/viewer.ts"></script>
</body>
</html>
